# Local pgvector instance for running the integration suite.
#
# Mirrors the CI service container in .github/workflows/integration.yml
# (same image, same credentials, same DB name) so a green local run is a
# faithful predictor of the CI integration job.
#
# Bring-up: `./scripts/test-db.sh up`   (creates role + runs migrations)
# Run tests: `./scripts/test-db.sh test` (or set MEM_MCP_TEST_DSN and run pytest yourself)
# Teardown:  `./scripts/test-db.sh down` (deletes the volume too — clean slate)
#
# Direct compose use (without the helper script) is fine too:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mem_mcp_test_pg
    environment:
      POSTGRES_USER: mem_test
      POSTGRES_PASSWORD: mem_test
      POSTGRES_DB: mem_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem_test -d mem_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - mem_mcp_test_pgdata:/var/lib/postgresql/data

volumes:
  mem_mcp_test_pgdata:
