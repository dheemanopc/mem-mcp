AWSTemplateFormatVersion: '2010-09-09'
Description: 'mem-mcp cert (us-east-1) — ACM certificate for Cognito custom domain. DNS validation; operator must add CNAMEs to their DNS provider (Route 53, GoDaddy, etc.) for ACM to issue.'

Parameters:
  DomainName:
    Type: String
    AllowedPattern: '^[a-z0-9]+([-.][a-z0-9]+)*\.[a-z]{2,}$'

  MemAuthSubdomain:
    Type: String
    Default: memauth

Resources:
  AuthCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub '${MemAuthSubdomain}.${DomainName}'
      ValidationMethod: DNS
      KeyAlgorithm: RSA_2048
      Tags:
        - Key: Name
          Value: !Sub 'mem-mcp-${MemAuthSubdomain}-cert'
        - Key: Project
          Value: mem-mcp

Outputs:
  CertificateArn:
    Value: !Ref AuthCertificate

  CertificateDomain:
    Value: !Sub '${MemAuthSubdomain}.${DomainName}'

  ValidationInstructions:
    Description: After deploy, run aws acm describe-certificate --certificate-arn <ARN> --region us-east-1 --query 'Certificate.DomainValidationOptions[].ResourceRecord' to get CNAMEs to add at your DNS provider.
    Value: 'See docs/runbooks/manual_dns_setup.md'
