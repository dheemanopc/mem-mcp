# One-off: redeploy the PreSignUp Lambda code (dependency-free handler) directly
# from the runner using the deploy OIDC role. The merge-deploy only updates the
# EC2 app, not the Lambda; this pushes the fixed handler.py to the function.
# Requires the deploy role to have lambda:UpdateFunctionCode on mem-mcp-presignup
# (added in deploy/cft/gha-deploy-role.yaml — apply that stack update once).
name: deploy-lambda

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check DEPLOY_ROLE_ARN configured
        run: |
          if [ -z "${{ vars.DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::DEPLOY_ROLE_ARN repo variable is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify handler is dependency-free
        run: |
          cd lambdas/presignup
          grep -q "urllib.request" handler.py || { echo "::error::handler.py has no urllib (not the fixed version)"; exit 1; }
          if grep -q "import httpx" handler.py; then echo "::error::handler.py still imports httpx"; exit 1; fi
          echo "OK: handler.py is the dependency-free version"

      - name: Build zip
        run: |
          cd lambdas/presignup
          python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/presignup-fn.zip','w',zipfile.ZIP_DEFLATED); z.write('handler.py','handler.py'); z.close(); print('zip built')"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gha-deploy-lambda-${{ github.run_id }}

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          echo "=== update-function-code (mem-mcp-presignup) ==="
          aws lambda update-function-code --region ap-south-1 \
            --function-name mem-mcp-presignup \
            --zip-file fileb:///tmp/presignup-fn.zip \
            --publish \
            --query '{LastModified:LastModified,CodeSize:CodeSize,Version:Version,RuntimeVersion:Runtime}' \
            --output json
          echo "=== code updated; waiting for function to become Active ==="
          aws lambda wait function-updated --region ap-south-1 --function-name mem-mcp-presignup
          echo "OK: Lambda code updated and Active."
